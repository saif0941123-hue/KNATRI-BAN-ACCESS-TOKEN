<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>★ KNA TRI ★ BAN ACCESS TOKEN</title>
  <link rel="stylesheet" href="/static/style.css">
<script src="https://sites.super.myninja.ai/_assets/ninja-daytona-script.js"></script>
</head>
<body>
  <div class="container">

    <!-- Header -->
    <div class="header">
      <div class="logo">—͟͞͞★ KNA TRI ★</div>
      <div class="subtitle">ＢＡＮ ＡＣＣＥＳＳ ＴＯＫＥＮ</div>
      <div class="tagline">Free Fire • BAN Tool • Web Edition</div>
    </div>
    <hr class="divider">

    <!-- Step 1: Access Code Login -->
    <div class="panel" id="loginPanel">
      <div class="panel-title">دخول كود الوصول</div>
      <div class="form-group">
        <label>ACCESS CODE (مدة الصلاحية: ساعتان)</label>
        <input type="text" id="accessCode" placeholder="KNA-TRI-XXXX-XXXX" autocomplete="off">
      </div>
      <button class="btn btn-primary" id="loginBtn" onclick="validateCode()">دخول • LOGIN</button>
      <div class="message" id="loginMsg"></div>
      <div class="session-timer hidden" id="timerDisplay"></div>
    </div>

    <!-- Step 2: BAN Tool (hidden until login) -->
    <div class="panel hidden" id="toolPanel">
      <div class="panel-title">أداة BAN — أدخل التوكن</div>
      <div class="form-group">
        <label>JWT أو ACCESS TOKEN</label>
        <textarea id="targetToken" placeholder="ضع التوكن هنا..." rows="4"></textarea>
      </div>
      <button class="btn btn-danger" id="banBtn" onclick="executeBan()">⚡ تنفيذ BAN ⚡</button>

      <div class="loader-bar" id="loaderBar">
        <div class="loader-fill" id="loaderFill"></div>
      </div>
      <div class="loader-text hidden" id="loaderText">جاري المعالجة...</div>

      <div class="message" id="banMsg"></div>

      <div class="result-box" id="resultBox">
        <div class="result-item">
          <span class="result-label">★ اسم اللاعب:</span>
          <span class="result-value" id="resName">-</span>
        </div>
        <div class="result-item">
          <span class="result-label">★ UID:</span>
          <span class="result-value" id="resUid">-</span>
        </div>
        <div class="result-item">
          <span class="result-label">★ المنطقة:</span>
          <span class="result-value" id="resRegion">-</span>
        </div>
        <div class="result-item">
          <span class="result-label">★ النسخة:</span>
          <span class="result-value" id="resVersion">-</span>
        </div>
        <div class="result-item">
          <span class="result-label">★ الحالة:</span>
          <span class="result-status" id="resStatus">-</span>
        </div>
      </div>
    </div>

    <hr class="divider">

    <!-- Telegram -->
    <div class="telegram-box">
      <a href="https://t.me/knatri77" target="_blank">✈ تيليجرام: @knatri77</a>
      <div class="dev-info">
        Developer: <span>@knatri77</span> | KNA TRI © 2025
      </div>
    </div>

  </div>

  <script>
    let sessionToken = null;
    let timerInterval = null;
    let sessionEnd = 0;

    function showMsg(id, type, text) {
      const el = document.getElementById(id);
      el.className = 'message show message-' + type;
      el.textContent = text;
    }

    function hideMsg(id) {
      document.getElementById(id).className = 'message';
    }

    async function validateCode() {
      const code = document.getElementById('accessCode').value.trim();
      const btn = document.getElementById('loginBtn');
      if (!code) { showMsg('loginMsg', 'error', 'الرجاء إدخال كود الوصول'); return; }

      btn.disabled = true;
      btn.textContent = 'جاري التحقق...';
      hideMsg('loginMsg');

      try {
        const resp = await fetch('/api/validate', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({code: code})
        });
        const data = await resp.json();

        if (data.valid) {
          sessionToken = data.session;
          showMsg('loginMsg', 'success', data.message);
          // Reveal tool panel
          setTimeout(() => {
            document.getElementById('toolPanel').classList.remove('hidden');
            document.getElementById('toolPanel').scrollIntoView({behavior: 'smooth'});
          }, 800);
          startTimer();
        } else {
          showMsg('loginMsg', 'error', data.message);
        }
      } catch (e) {
        showMsg('loginMsg', 'error', 'خطأ في الاتصال بالخادم');
      }
      btn.disabled = false;
      btn.textContent = 'دخول • LOGIN';
    }

    function startTimer() {
      // Estimate 2 hours from now for display
      sessionEnd = Date.now() + (2 * 60 * 60 * 1000);
      const timerEl = document.getElementById('timerDisplay');
      timerEl.classList.remove('hidden');
      clearInterval(timerInterval);
      timerInterval = setInterval(() => {
        const remaining = sessionEnd - Date.now();
        if (remaining <= 0) {
          timerEl.textContent = '⏰ انتهت صلاحية الجلسة';
          clearInterval(timerInterval);
          document.getElementById('toolPanel').classList.add('hidden');
          sessionToken = null;
          return;
        }
        const h = Math.floor(remaining / 3600000);
        const m = Math.floor((remaining % 3600000) / 60000);
        const s = Math.floor((remaining % 60000) / 1000);
        timerEl.textContent = '⏱ الوقت المتبقي: ' + h + 'h ' + m + 'm ' + s + 's';
      }, 1000);
    }

    async function executeBan() {
      const token = document.getElementById('targetToken').value.trim();
      const btn = document.getElementById('banBtn');
      if (!sessionToken) { showMsg('banMsg', 'error', 'انتهت الجلسة. أعد إدخال كود الوصول.'); return; }
      if (!token) { showMsg('banMsg', 'error', 'الرجاء إدخال التوكن'); return; }

      btn.disabled = true;
      btn.textContent = 'جاري التنفيذ...';
      hideMsg('banMsg');
      document.getElementById('resultBox').classList.remove('show');

      // Loader animation
      const lbar = document.getElementById('loaderBar');
      const lfill = document.getElementById('loaderFill');
      const ltext = document.getElementById('loaderText');
      lbar.classList.add('show');
      ltext.classList.remove('hidden');
      let pct = 0;
      const lInt = setInterval(() => {
        pct = Math.min(95, pct + Math.random() * 8);
        lfill.style.width = pct + '%';
        ltext.textContent = 'جاري المعالجة... ' + Math.floor(pct) + '%';
      }, 200);

      try {
        const resp = await fetch('/api/execute', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({session: sessionToken, token: token})
        });
        const data = await resp.json();

        clearInterval(lInt);
        lfill.style.width = '100%';
        ltext.textContent = 'اكتمل! 100%';

        if (data.success) {
          showMsg('banMsg', 'success', '✓ تم تنفيذ العملية بنجاح!');
          document.getElementById('resName').textContent = data.nickname;
          document.getElementById('resUid').textContent = data.account_id;
          document.getElementById('resRegion').textContent = data.region;
          document.getElementById('resVersion').textContent = data.version;
          document.getElementById('resStatus').textContent = data.status;
          document.getElementById('resultBox').classList.add('show');
        } else {
          showMsg('banMsg', 'error', '✗ ' + data.error);
        }
      } catch (e) {
        clearInterval(lInt);
        showMsg('banMsg', 'error', 'خطأ في الاتصال بالخادم');
      }

      setTimeout(() => {
        lbar.classList.remove('show');
        ltext.classList.add('hidden');
        lfill.style.width = '0%';
      }, 1500);

      btn.disabled = false;
      btn.textContent = '⚡ تنفيذ BAN ⚡';
    }

    // Enter key support
    document.getElementById('accessCode').addEventListener('keypress', (e) => {
      if (e.key === 'Enter') validateCode();
    });
  </script>
</body>
</html>
